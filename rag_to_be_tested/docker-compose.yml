services:
  rag_api:
    build: .
    container_name: rag_eval_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/src/logs
      - ./config.yaml:/app/config.yaml
      - ./hf_cache:/root/.cache/huggingface
      # - [YOUR_PATH_TO_CHROMADB]:/app/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3